[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
# "koro" is taken on PyPI by an unrelated project. The distribution is koro-learn;
# the command and the import name are still `koro`.
name = "koro-learn"
version = "0.3.0"
description = "A headless teacher agent: learn books, papers and repos from any terminal, driven by the coding agent you already use."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Ninad Kale" }]
keywords = ["learning", "teaching", "books", "papers", "claude", "mcp", "supabase"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Topic :: Education",
]
dependencies = ["pypdf>=4.0", "pdfplumber>=0.10"]

[project.urls]
Homepage = "https://github.com/ninadkale98/koro"
Source = "https://github.com/ninadkale98/koro"

[project.scripts]
koro = "koro.cli:main"

[tool.setuptools]
packages = ["koro"]

[tool.setuptools.package-data]
koro = ["data/*.md"]
