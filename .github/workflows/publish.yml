# Publishes koro-learn to PyPI. Releasing = bump `version` in pyproject.toml and push to
# main (or push a v* tag, or run it by hand). Versions already on PyPI are skipped, so
# re-runs are harmless. Uses PyPI trusted publishing: no API token is stored anywhere.
# One-time setup on pypi.org: a publisher for project "koro-learn", owner "ninadkale98",
# repository "koro", workflow "publish.yml", environment "pypi".
name: publish

on:
  push:
    branches: [main]
    paths: ["pyproject.toml", ".github/workflows/publish.yml"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version $version"; exit 1; }
      - name: Test
        run: |
          pip install -e .
          python -m unittest discover -s tests -t .
      - name: Build
        run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
